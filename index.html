<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Climora</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

/* 🌌 Animated Background */
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(circle at top, #1e293b, #0f172a);
}

body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(56,189,248,0.2), transparent);
  animation: moveBg 10s infinite linear;
}

@keyframes moveBg {
  from { transform: translate(-25%, -25%); }
  to { transform: translate(25%, 25%); }
}

/* 📱 App */
.app {
  width: 360px;
  padding: 15px;
  color: white;
  position: relative;
  z-index: 1;
}

/* 🧊 Glass Effect */
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  padding: 15px;
  margin-top: 15px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

/* ✨ Glow Title */
h1 {
  text-align: center;
  text-shadow: 0 0 10px #38bdf8;
}

/* 🔍 Search */
.search {
  display: flex;
  gap: 10px;
}

input, button {
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  background: #38bdf8;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #0ea5e9;
  transform: scale(1.05);
}

/* 🌀 Loader */
.loader {
  width: 40px;
  height: 40px;
  border: 5px solid rgba(255,255,255,0.2);
  border-top: 5px solid #38bdf8;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* 🌊 Floating icon */
.weather-icon {
  width: 100px;
  animation: float 3s infinite ease-in-out;
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

/* 🗺️ Map */
#map {
  height: 200px;
  border-radius: 12px;
  margin-top: 10px;
}

/* 📊 Forecast */
.forecast {
  display: flex;
  overflow-x: auto;
  gap: 10px;
}

.forecast div {
  background: rgba(255,255,255,0.2);
  padding: 10px;
  border-radius: 10px;
  min-width: 80px;
}

/* 🎬 Splash Screen */
#splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}

#splash h1 {
  font-size: 32px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #38bdf8; }
  to { text-shadow: 0 0 30px #38bdf8; }
}

</style>
</head>

<body>

<!-- 🎬 Splash -->
<div id="splash">
  <h1>🌍 Climora</h1>
  <div class="loader"></div>
</div>

<div class="app" style="display:none;" id="app">

<h1>🌍 Climora</h1>
<div id="time" style="text-align:center;"></div>

<div class="search">
  <input id="city" placeholder="Enter city">
  <button onclick="getWeather()">Search</button>
</div>

<div id="weather" class="card"></div>

<div class="card">
  <div id="map"></div>
  <button onclick="toggleRadar()">🌩️ Radar</button>
</div>

<div id="forecast" class="card"></div>

</div>

<script>
const apiKey = "29d3ca78ef7c180ec1977c45c5cbde12";

// 🎬 Splash delay
setTimeout(()=>{
  document.getElementById("splash").style.display = "none";
  document.getElementById("app").style.display = "block";
},2000);

// ⏰ Time
setInterval(()=>{
  document.getElementById("time").innerText =
    new Date().toLocaleString();
},1000);

// 🗺️ Map
let map = L.map('map').setView([20,78],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker;

let radar = L.tileLayer(
`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${apiKey}`
);

let radarOn = false;
function toggleRadar(){
  radarOn ? map.removeLayer(radar) : radar.addTo(map);
  radarOn = !radarOn;
}

// 🌦️ Weather
async function getWeather(){
  const city = document.getElementById("city").value;

  document.getElementById("weather").innerHTML =
    '<div class="loader"></div>';

  const res = await fetch(
  `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
  );

  const data = await res.json();

  showWeather(data);
  updateMap(data.coord.lat,data.coord.lon);
  getForecast(data.coord.lat,data.coord.lon);
}

// 📍 Auto location
window.onload = ()=>{
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const res = await fetch(
    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`
    );

    const data = await res.json();

    showWeather(data);
    updateMap(lat,lon);
    getForecast(lat,lon);
  });
};

// 📊 Show weather
function showWeather(data){
  document.getElementById("weather").innerHTML = `
    <h2>${data.name}</h2>
    <img class="weather-icon" src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png">
    <h3>${data.main.temp}°C</h3>
    <p>${data.weather[0].description}</p>
  `;
}

// 🗺️ Map update
function updateMap(lat,lon){
  map.setView([lat,lon],10);
  if(marker) map.removeLayer(marker);
  marker = L.marker([lat,lon]).addTo(map);
}

// 📊 Forecast
async function getForecast(lat,lon){
  const res = await fetch(
  `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`
  );

  const data = await res.json();

  let html = "<h3>Forecast</h3><div class='forecast'>";

  data.list.slice(0,5).forEach(item=>{
    html += `
      <div>
        <p>${new Date(item.dt_txt).getHours()}:00</p>
        <img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png">
        <p>${item.main.temp}°C</p>
      </div>
    `;
  });

  html += "</div>";
  document.getElementById("forecast").innerHTML = html;
}
</script>

</body>
</html>
