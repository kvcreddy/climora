<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Climora - Final Boss Weather App</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PWA Manifest -->
<link rel="manifest" href="data:application/json,{\"name\":\"Climora\",\"short_name\":\"Climora\",\"start_url\":\".\",\"display\":\"standalone\",\"background_color\":\"#0b0f1a\",\"theme_color\":\"#00c6ff\",\"icons\":[]}"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
overflow-x:hidden;
transition:0.4s;
}

.bg{
position:fixed;
inset:0;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#00c6ff);
background-size:400% 400%;
animation:grad 12s ease infinite;
z-index:-2;
will-change:background-position;
}

@keyframes grad{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{width:92%;max-width:650px;text-align:center;}

header h1{font-size:3rem;}
header p{opacity:0.8;margin-bottom:10px;}

.top-bar{
display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;
}

input{
padding:12px;
border:none;
border-radius:10px;
outline:none;
width:200px;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00c6ff;
color:white;
}

.voice{background:#ffcc00;color:#000;}
.mode{background:#222;}

/* suggestions */
.suggest{
position:absolute;
background:#111;
width:200px;
border-radius:10px;
margin-top:5px;
overflow:hidden;
}
.suggest div{
padding:8px;cursor:pointer;
}
.suggest div:hover{background:#00c6ff;}

.card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(14px);
padding:22px;
border-radius:18px;
margin-top:12px;
}

.temp{font-size:3rem;}
.small{opacity:0.85;}

.forecast{display:flex;gap:6px;overflow-x:auto;margin-top:12px;}
.day{min-width:75px;background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;}

canvas{margin-top:15px;}

.loader{position:fixed;inset:0;background:#0b0f1a;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:999;}
</style>
</head>

<body>

<div class="loader" id="loader">
<h2>Climora Final</h2>
<p>Booting system...</p>
</div>

<div class="bg"></div>

<div class="container">

<header>
<h1>Climora</h1>
<p>Final Boss Weather System</p>
</header>

<div class="top-bar">
<div style="position:relative">
<input id="city" oninput="suggest()" placeholder="Enter city..."/>
<div id="box" class="suggest"></div>
</div>
<button onclick="debouncedSearch()">Search</button>
<button class="voice" onclick="voice()">🎤</button>
<button class="mode" onclick="toggle()">🌙</button>
<button onclick="notifyWeather()">🔔</button>
</div>

<div class="card">
<h2 id="name">--</h2>
<div class="temp" id="temp">--°C</div>
<div class="small" id="desc">Ready</div>
<div class="small" id="extra"></div>

<div class="forecast" id="forecast"></div>

<canvas id="chart" height="180"></canvas>
</div>

</div>

<script>
const API_KEY="29d3ca78ef7c180ec1977c45c5cbde12";
const cache=new Map();
let chart;

// auto dark mode
if(new Date().getHours()>18 || new Date().getHours()<6){
document.body.classList.add("dark");
}

// loader
setTimeout(()=>document.getElementById("loader").style.display="none",900);

// debounce
let t;
function debouncedSearch(){clearTimeout(t);t=setTimeout(getWeather,250);}

// suggestions
const cities=["Delhi","Mumbai","Chennai","Kolkata","Bangalore","Hyderabad","London","New York"];
function suggest(){
let val=document.getElementById("city").value.toLowerCase();
let box=document.getElementById("box");
box.innerHTML="";
if(!val)return;
cities.filter(c=>c.toLowerCase().includes(val)).forEach(c=>{
box.innerHTML+=`<div onclick=pick('${c}')>${c}</div>`;
});
}
function pick(c){document.getElementById("city").value=c;box.innerHTML="";}

async function getWeather(){
let city=document.getElementById("city").value;
if(!city)return;

if(cache.has(city)){update(cache.get(city));getForecast(city);return;}

let r=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);
let d=await r.json();
if(d.cod!=200)return;
cache.set(city,d);
update(d);
getForecast(city);
}

function update(d){
document.getElementById("name").innerText=d.name;
document.getElementById("temp").innerText=Math.round(d.main.temp)+"°C";
document.getElementById("desc").innerText=d.weather[0].description;
document.getElementById("extra").innerText=`Humidity ${d.main.humidity}% | Wind ${d.wind.speed} m/s`;
}

async function getForecast(city){
let r=await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`);
let d=await r.json();
render(d);
}

function render(d){
let f=document.getElementById("forecast");f.innerHTML="";
let temps=[],labels=[];
for(let i=0;i<5;i++){
let x=d.list[i*8];
if(!x)continue;
f.innerHTML+=`<div class='day'>${Math.round(x.main.temp)}°C<br>${new Date(x.dt_txt).getDate()}</div>`;
temps.push(x.main.temp);
labels.push(new Date(x.dt_txt).getDate());
}

if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{labels,datasets:[{data:temps,borderColor:"#00c6ff",tension:0.4,fill:true}]},
options:{plugins:{legend:{display:false}}}
});
}

// voice
function voice(){let r=new (window.SpeechRecognition||webkitSpeechRecognition)();r.start();r.onresult=e=>{city.value=e.results[0][0].transcript;debouncedSearch();}}

// dark
function toggle(){document.body.classList.toggle("dark");}

// notifications
function notifyWeather(){
if(!Notification) return;
Notification.requestPermission().then(p=>{
if(p=="granted"){
new Notification("Climora Alert",{body:"Weather system active 🌤"});
}
});
}

// GPS
navigator.geolocation.getCurrentPosition(async p=>{
let r=await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${p.coords.latitude}&lon=${p.coords.longitude}&appid=${API_KEY}&units=metric`);
let d=await r.json();update(d);getForecast(d.name);
});

// PWA service worker
if('serviceWorker' in navigator){
const sw=`self.addEventListener('fetch',()=>{});`;
navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'})));
}

</script>

</body>
</html>
